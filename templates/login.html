{% extends "base.html" %}
{% block title %}Log in - {{ shop.shop_name or 'DOINEEK' }}{% endblock %}
{% block content %}
<div class="login-shell" style="width: 100%; max-width: 420px; margin: 0 auto;">
  <div class="login-card" style="background: #fff; padding: 36px 30px; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(109,40,217,0.10); text-align: center;">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="{{ shop.shop_name }}" style="width:130px; margin-bottom:12px; display: inline-block;">
    <h1 style="font-size: 22px; color: var(--green); margin-bottom: 4px;">{{ shop.shop_name }}</h1>
    <p class="subtitle" style="color: var(--ink-soft); font-size: 13px; margin-bottom: 22px;">Staff & Admin POS Management Portal</p>
    
    <form method="POST">
      <div class="field" style="text-align:left; margin-bottom: 14px;">
        <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px;">Username</label>
        <input type="text" name="username" required autofocus style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size:14px;">
      </div>
      <div class="field" style="text-align:left; margin-bottom: 18px;">
        <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px;">Password</label>
        <input type="password" name="password" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size:14px;">
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size:14px; background:#6d28d9; color:#fff;" type="submit">Log in to Register</button>
    </form>
    
    <div style="margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--line); display:flex; flex-direction:column; gap:10px;">
      <a href="{{ url_for('store_front') }}" style="color:#16a34a; font-weight:700; font-size:13px; text-decoration:none;">
        Go to Customer Web Storefront &rarr;
      </a>
      <a href="{{ url_for('download_app_apk') }}" style="display:block; width:100%; padding:10px 14px; border-radius:8px; font-weight:700; font-size:13px; text-decoration:none; text-align:center; color:#2563eb; border:1px solid #2563eb; background:#eff6ff; transition:all 0.2s;" onmouseover="this.style.background='#dbeafe'" onmouseout="this.style.background='#eff6ff'">
        Download App APK
      </a>
      <p class="login-hint" style="font-size: 11px; color: var(--ink-soft); margin: 4px 0 0 0;">
        Default Staff Login: <strong>admin</strong> / <strong>admin123</strong>
      </p>
    </div>
  </div>
</div>
{% endblock %}
