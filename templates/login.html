{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login-shell" style="width: 100%; max-width: 400px; margin: 0 auto;">
  <div class="login-card" style="background: #fff; padding: 36px; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(109,40,217,0.10); text-align: center;">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="{{ shop.shop_name }}" style="width:140px; margin-bottom:12px; display: inline-block;">
    <h1 style="font-size: 24px; color: var(--green); margin-bottom: 6px;">{{ shop.shop_name }}</h1>
    <p class="subtitle" style="color: var(--ink-soft); font-size: 14px; margin-bottom: 24px;">Sign in to open the register</p>
    
    <form method="POST">
      <div class="field" style="text-align:left; margin-bottom: 16px;">
        <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px;">Username</label>
        <input type="text" name="username" required autofocus style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px;">
      </div>
      <div class="field" style="text-align:left; margin-bottom: 20px;">
        <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px;">Password</label>
        <input type="password" name="password" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px;">
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;" type="submit">Log in</button>
    </form>
    
    <p class="login-hint" style="font-size: 12px; color: var(--ink-soft); margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line);">
      Default login: <strong>admin</strong> / <strong>admin123</strong>
    </p>
  </div>
</div>
{% endblock %}
