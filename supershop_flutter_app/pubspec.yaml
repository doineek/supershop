name: supershop_app
description: "Supershop Real-time E-Commerce & Delivery Flutter App (Dual Language English & Bangla)"
publish_to: 'none'
version: 1.0.30+31

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  http: ^1.1.0
  shared_preferences: ^2.2.0
  image_picker: ^1.0.4
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.1
  flutter_local_notifications: ^21.0.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
